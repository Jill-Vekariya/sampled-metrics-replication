abstract: "An independent Python implementation is used to revisit the fixed-rank\
  \ counterexample in Krichene and Rendle's IJCAI 2021 article. Finite-distribution\
  \ expectations, 1000-repeat Monte Carlo evaluations and separate 100000-repeat checks\
  \ reproduce the central ranking reversal. Full-catalogue average precision favors\
  \ C over A (0.101379 versus 0.010000), whereas evaluating with 99 uniformly sampled\
  \ negatives favors A over C (expected values 0.636592 versus 0.326169). Expected\
  \ AUC is invariant to sample size. All 12 printed exact-metric values agree at the\
  \ source's three-decimal precision. Secondary calculations retain the reversal without\
  \ replacement and show remaining bias after a simple rank correction. The evidence\
  \ concerns a designed five-instance example, not trained models or real users."
