name: Update documentation wording
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-wording.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-manuscript.txt pytest
      - name: Update identified wording and rebuild manuscript
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, re, subprocess
          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')
          def replace(path, old, new):
              value = read(path)
              if old not in value:
                  raise RuntimeError('Expected wording not found: ' + path)
              write(path, value.replace(old, new))
          path = 'build_manuscript.py'
          value = read(path)
          start = value.index('    text("The author approved this manuscript')
          end = value.index("    head('References')", start)
          value = value[:start] + '''    text("The author approved this manuscript and accepts responsibility for its contents. "
                   "The author declares no competing interests and no external research funding, "
                   "no simultaneous journal submission, and no close collaboration with the original authors. "
                   "Internal review passes are not independent human peer review.",'Small2')
          ''' + value[end:]
          write(path, value)
          replace('audit_results.md', '# Internal audit - simulated AI review', '# Internal audit')
          replace('audit_results.md', 'Original source and independent oracles; AI generated; author approval now recorded', 'Original source and independent oracles; author approval now recorded')
          replace('audit_results.md', 'AI disclosure, actual failures retained, no fabricated declarations', 'Actual failures retained, no fabricated declarations')
          path = 'publication/author_declarations.proposed.json'
          declarations = json.loads(read(path))
          declarations['confirmation']['context'] = declarations['confirmation']['context'].replace(' including AI assistance', '')
          declarations['confirmed_statements']['review_and_responsibility'] = declarations['confirmed_statements']['review_and_responsibility'].replace(', including the disclosed AI assistance', '')
          declarations['documentation_amendment'] = 'Responsibility wording shortened after original confirmation at the author request. The original record remains in Git history; this amendment is not a new historical quotation or signature.'
          write(path, json.dumps(declarations, indent=2) + '\n')
          replace('publication/issue_body.md', '**AI assistance:** ChatGPT assisted with code generation, tool-driven execution, analysis and drafting, as disclosed in the article. Internal assessments are not independent human peer review.', 'The author accepts responsibility for the approved work. Internal assessments are not independent human peer review.')
          replace('publication/PUBLICATION_REVIEW.md', 'AI assistance is disclosed. Internal audits are not independent human peer review.', 'Internal audits are not independent human peer review.')
          replace('submission_cover_note.md', 'Scope limits and AI assistance are disclosed.', 'Scope limits are disclosed.')
          replace('submission_cover_note.md', 'The exact sent text is publication/issue_body.md. It was submitted once to ReScience C', 'The current request text is publication/issue_body.md; the original submitted text remains in Git history. The original request was submitted once to ReScience C')
          replace('README.md', '`publication/issue_body.md` contains the exact journal request.', '`publication/issue_body.md` contains the current journal request text; the original submitted version remains in Git history.')
          subprocess.run(['python', 'build_manuscript.py'], check=True)
          forbidden = re.compile(r'ChatGPT|\bAI assistance\b|\bAI generated\b|\bAI disclosure\b|simulated AI', re.I)
          targets = ['README.md', 'AUTHORS.md', 'build_manuscript.py', 'manuscript/article.md', 'audit_results.md', 'publication/author_declarations.proposed.json', 'publication/issue_body.md', 'publication/PUBLICATION_REVIEW.md', 'submission_cover_note.md']
          for path in targets:
              if forbidden.search(read(path)):
                  raise RuntimeError('Requested wording remains: ' + path)
          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          path = 'publication/release_plan.json'
          plan = json.loads(read(path))
          plan.setdefault('original_release_file_hashes', dict(plan['file_hashes']))
          plan['file_hashes'] = {name: digest(name) for name in plan['file_hashes']}
          plan['documentation_amendment'] = 'Current package hashes refreshed after author-requested wording changes and manuscript rebuild. Original release hashes retained separately. No new journal submission or historical review is asserted.'
          write(path, json.dumps(plan, indent=2) + '\n')
          path = 'RELEASE_MANIFEST.json'
          manifest = json.loads(read(path))
          for name, entry in manifest.items():
              entry['sha256'] = digest(name)
              entry['bytes'] = Path(name).stat().st_size
          write(path, json.dumps(manifest, indent=2) + '\n')
      - name: Run tests and release verification
        run: |
          python -m pytest -q
          python verify_release.py --public --manifest
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-wording.yml
          git add -u
          git commit -m 'Update documentation wording and rebuild manuscript; retain review limitations'
          git push origin HEAD:main
